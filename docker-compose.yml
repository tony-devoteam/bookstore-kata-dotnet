services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: bookstore
    ports:
      - "8080:8080"
    networks:
      - bookstore-network

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_DATABASE: bookstore
    volumes:
      - mongodb-data:/data/db
    networks:
      - bookstore-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

networks:
  bookstore-network:
    driver: bridge

volumes:
  mongodb-data:

